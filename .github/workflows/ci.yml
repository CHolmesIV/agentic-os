name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate example config
        run: |
          cp config/sites.example.yml config/sites.yml
          cp config/systems.example.yml config/systems.yml
          python runner/validate_config.py
      - name: Compile Python
        run: python -m compileall -q adapters runner reports scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Syntax-check node files
        run: for f in bot/*.mjs adapters/*.mjs; do node --check "$f"; done
